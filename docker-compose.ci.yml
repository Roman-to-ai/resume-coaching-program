# docker-compose.ci.yml
# CI 专用：复用宿主机已有的 mysql8 容器，不重建
# 不指定 container_name，由 COMPOSE_PROJECT_NAME 自动加前缀区分生产容器

services:
  ai-service:
    build: ./ai-service
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "8001:8001"

  backend:
    build: ./backend
    restart: on-failure
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_DATABASE: careerlens
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      AI_SERVICE_URL: http://ai-service:8001
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ai-service

  bff:
    build: ./bff
    environment:
      BACKEND_BASE_URL: http://backend:8080
      AI_SERVICE_URL: http://ai-service:8001
    ports:
      - "3000:3000"
    depends_on:
      - backend

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - bff
