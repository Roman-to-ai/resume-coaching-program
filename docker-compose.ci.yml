# docker-compose.ci.yml
# CI 专用：复用宿主机已有的 mysql8 容器，不重建
# 不暴露端口到宿主机（CI 容器间内部通信），避免与生产容器端口冲突

services:
  ai-service:
    build: ./ai-service
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}

  backend:
    build: ./backend
    restart: on-failure
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_DATABASE: careerlens
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      AI_SERVICE_URL: http://ai-service:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ai-service

  bff:
    build: ./bff
    environment:
      BACKEND_BASE_URL: http://backend:8080
      AI_SERVICE_URL: http://ai-service:8001
    depends_on:
      - backend

  frontend:
    build: ./frontend
    depends_on:
      - bff
