services:
  smoke-test:
    image: python:3.11-slim
    container_name: careerlens-smoke-test
    volumes:
      - ./scripts:/scripts:ro
    command: ["python", "/scripts/smoke_test.py", "http://careerlens-bff:3000"]
    depends_on:
      - bff
      - backend
      - ai-service
    profiles:
      - test
